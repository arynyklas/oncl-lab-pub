name: Ошибка
description: Программа работает не так, как должна
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте ключи, пароли и сертификаты. Журнал просмотрите перед отправкой.
        Об уязвимостях пишите приватно: см. SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали и что произошло.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Система
      options:
        - Windows 7
        - Windows 10 или новее
        - macOS
        - Linux
        - Другая
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия OpenNCALayer
      description: Из окна «О программе» или `openncalayer --version`.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Как сайт подключается
      options:
        - Расширение браузера
        - Сертификат для браузера (wss/TLS)
        - Командная строка oncl
        - HTTP-сервис oncl-server
        - Не знаю
  - type: input
    id: site
    attributes:
      label: Сайт или плагин
      description: Адрес сайта или название плагина, если ошибка связана с ними.
  - type: dropdown
    id: key
    attributes:
      label: Тип ключа
      options:
        - Файл .p12 / .pfx
        - Файл .jks
        - Токен или удостоверение личности
        - Не связано с ключом
  - type: textarea
    id: log
    attributes:
      label: Сообщение об ошибке или журнал
      render: text

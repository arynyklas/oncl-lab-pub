name: cargo-nextest
description: >-
  Installs the pinned cargo-nextest release binary (checked against its SHA-256 from the
  release) into the runner's temporary directory and puts it on PATH. The archive jobs and
  the jobs that run their archives use the same version, as nextest asks.
runs:
  using: composite
  steps:
    - name: Install cargo-nextest 0.9.151
      shell: bash
      run: |
        version=0.9.151
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            asset=x86_64-unknown-linux-gnu.tar.gz
            sum=1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4 ;;
          Windows-X64)
            asset=x86_64-pc-windows-msvc.tar.gz
            sum=e51bdb4b5883df48f335381b287378edb244318fac65ae0adaf6b9e69298246b ;;
          macOS-ARM64 | macOS-X64)
            asset=universal-apple-darwin.tar.gz
            sum=d1d7d025d4bfc9fb154cd76aea3949bd78534829a0589abefa6e5dd4edb135dd ;;
          *)
            echo "::error::no pinned cargo-nextest for $RUNNER_OS-$RUNNER_ARCH"
            exit 1 ;;
        esac
        dir="$RUNNER_TEMP/nextest"
        mkdir -p "$dir"
        # Relative paths: GNU tar of Git for Windows reads a path with a drive letter as a
        # remote host.
        cd "$dir" || exit 1
        curl -sSfL --retry 3 -o nextest.tar.gz \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-$asset"
        if command -v sha256sum > /dev/null; then
          echo "$sum  nextest.tar.gz" | sha256sum -c -
        else
          echo "$sum  nextest.tar.gz" | shasum -a 256 -c -
        fi
        tar -xzf nextest.tar.gz
        rm nextest.tar.gz
        echo "$dir" >> "$GITHUB_PATH"

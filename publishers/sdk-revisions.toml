# The commits of the released SDK (oncl-pdk and the rest of the chain in docs/dev/sdk.md,
# section 7) a publisher's plugin may depend on: the SDK is not on crates.io, a plugin names
# https://github.com/arynyklas/OpenNCALayer as a git dependency with a release tag, and its
# Cargo.lock pins the tag's commit, which must be listed here (check 17,
# docs/design/publishers.md, Р44).
#
# The release process appends each new tag (`cargo xtask sdk revision add v<version>`,
# docs/dev/release.md). An entry is never changed or removed; `vendor check-onboarding --base`
# (index-check.yml) checks that each tag points to the commit of one of its entries. A tag
# moved before its publication gets a second entry (run `sdk revision add` again); its
# entries must hold the same SDK. The schema and its rules:
# xtask/src/publishers/sdk_revisions.rs.
#
# [[revision]]
# tag = "v<version>"            # the release tag
# commit = "<40 lowercase hex>" # a commit it points (or pointed) to

